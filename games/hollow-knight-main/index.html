<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Unity WebGL Player | Hollow Knight</title>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000;overflow:hidden}
    #loading-text{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font:24px Arial}
    #unity-canvas{width:100vw;height:100vh;display:block}
    #unity-mobile-warning{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;background:rgba(0,0,0,.9);padding:20px;border-radius:8px;font:14px Arial}
    #fps-graph{position:fixed;top:12px;left:12px;width:200px;height:70px;background:rgba(0,0,0,.8);border-radius:6px;padding:10px;z-index:9999;transition:.3s}
    #fps-canvas{width:100%;height:100%;display:block}
    .savebtn{position:fixed;top:12px;right:12px;padding:10px 18px;cursor:pointer;background:rgba(50,50,50,.85);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:6px;font:14px Arial;z-index:9999;transition:.3s}
    .savebtn:hover{background:rgba(70,70,70,.95)}
    .hidden{opacity:0;pointer-events:none}
  </style>
</head>

<body>
  <div id="loading-text">truffed.lol</div>
  <div id="unity-mobile-warning">WebGL not supported on mobile</div>
  <canvas id="unity-canvas"></canvas>
  <div id="fps-graph" style="display:none"><canvas id="fps-canvas"></canvas></div>

  <script>
    alert("port by R Spedman")

    const lt=document.getElementById("loading-text"),
      cv=document.getElementById("unity-canvas"),
      mw=document.getElementById("unity-mobile-warning"),
      fg=document.getElementById("fps-graph"),
      fc=document.getElementById("fps-canvas");

    let lb=0,hd=false,tm_id;
    const tm='912.81',fh=[],ml=90;
    const HK_CACHE_NAME="hollow-knight-main-cache-v1";

    fc.width=180;
    fc.height=50;

    const ctx=fc.getContext('2d');
    let lft=performance.now(),fr=0,fps=60,sb;

    function uf(){
      const nt=performance.now(),dt=(nt-lft)/1000;
      lft=nt;
      fps=dt>0?1/dt:60;
      fr++;

      if(fr%3===0){
        fh.push(fps);
        if(fh.length>ml)fh.shift();

        ctx.clearRect(0,0,180,50);

        for(let i=0;i<fh.length;i++){
          const f=fh[i],
            h=Math.min(f/60,1)*35,
            c=f>50?'#0f0':f>30?'#fa0':'#f33';

          ctx.fillStyle=c;
          ctx.fillRect(i*2,50-h,1.8,h);
        }

        ctx.fillStyle='#fff';
        ctx.font='bold 13px monospace';
        ctx.shadowColor='#000';
        ctx.shadowBlur=4;
        ctx.fillText(Math.round(fps)+' FPS',6,16);
        ctx.shadowBlur=0;
      }

      requestAnimationFrame(uf);
    }

    function shw(){
      hd=false;
      fg.classList.remove('hidden');
      if(sb)sb.classList.remove('hidden');
    }

    function rst(){
      clearTimeout(tm_id);
      if(!hd){
        hd=true;
        fg.classList.add('hidden');
        if(sb)sb.classList.add('hidden');
      }
      tm_id=setTimeout(shw,5000);
    }

    document.addEventListener('keydown',rst);

    if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)){
      const m=document.createElement('meta');
      m.name='viewport';
      m.content='width=device-width,height=device-height,initial-scale=1,user-scalable=no,shrink-to-fit=yes';
      document.head.appendChild(m);
      mw.style.display="block";
      setTimeout(()=>mw.style.display="none",5000);
    }

    const ASSET_BASE='https://raw.githubusercontent.com/9m113konkors/Scholarium/da932940451e8342ce35fee65bb42f4479ca5a59/';
    const cachePromise = (async()=>{try{return await caches.open('hollow-knight-parts-da932940-v1');}catch(_){return null;}})();
    async function fwp(u){
      const url=ASSET_BASE+u, cache=await cachePromise;
      const expected=u.endsWith('data.part45')?8756670:u.endsWith('wasm.part2')?9390603:20866662;
      if(cache){try{const hit=await cache.match(url);if(hit){const blob=await hit.blob();if(blob.size===expected){lb+=blob.size;lt.textContent=`Loading cached assets… ${(lb/1048576).toFixed(1)} MB`;return blob;}await cache.delete(url);}}catch(_){}}
      let lastError;
      for(let attempt=0;attempt<3;attempt++){
        try{
          const r=await fetch(url,{signal:AbortSignal.timeout(120000)});
          if(!r.ok)throw new Error(`Download failed (${r.status}): ${u}`);
          const blob=await r.blob();
          if(blob.size!==expected)throw new Error('Incomplete game file: '+u);
          if(cache){try{await cache.put(url,new Response(blob));}catch(_){console.warn('Cache unavailable; continuing without saving this part.');}}
          lb+=blob.size;lt.textContent=`Loading… ${(lb/1048576).toFixed(1)} MB / ${tm} MB`;
          return blob;
        }catch(error){lastError=error;if(attempt<2)await new Promise(r=>setTimeout(r,500*(attempt+1)));}
      }
      throw lastError;
    }
    async function mf(paths){
      const blobs=new Array(paths.length);let next=0;
      async function worker(){while(next<paths.length){const i=next++;blobs[i]=await fwp(paths[i]);}}
      await Promise.all([worker(),worker()]);
      return URL.createObjectURL(new Blob(blobs));
    }

    function gp(f,s,e){
      return Array.from({length:e-s+1},(_,i)=>`${f}.part${s+i}`);
    }

    (async()=>{
      try{
        const [du,wu]=await Promise.all([
          mf(gp("Build/hktruffled.data",1,45)),
          mf(gp("Build/hktruffled.wasm",1,2))
        ]);

        const sc=document.createElement("script");
        sc.src="Build/hktruffled.loader.js";

        sc.onload=()=>{
          createUnityInstance(cv,{
            dataUrl:du,
            frameworkUrl:"Build/hktruffled.framework.js",
            codeUrl:wu,
            streamingAssetsUrl:"StreamingAssets",
            companyName:"Team Cherry",
            productName:"Hollow Knight",
            productVersion:"1.0"
          }).then(()=>{
            lt.remove();
            asb();
            fg.style.display='block';
            uf();
          }).catch(alert);
        };

        sc.onerror=()=>{
          alert("Failed to load Hollow Knight loader.");
        };

        document.body.appendChild(sc);
      }catch(e){
        console.error(e);
        lt.textContent="ERROR: "+e.message;
        const retry=document.createElement('button');retry.textContent='Retry loading';retry.onclick=()=>location.reload();lt.appendChild(retry);
      }
    })();

    function asb(){
      sb=document.createElement('button');
      sb.className='savebtn';
      sb.textContent='download';
      sb.onclick=sdl;
      document.body.appendChild(sb);
    }

    function odb(n){
      return new Promise((ok,bd)=>{
        const r=indexedDB.open(n);
        r.onsuccess=()=>ok(r.result);
        r.onerror=()=>bd(r.error);
      });
    }

    function ga(d,s){
      return new Promise((ok,bd)=>{
        const t=d.transaction([s],'readonly'),
          st=t.objectStore(s),
          r=st.getAll();

        r.onsuccess=()=>ok(r.result);
        r.onerror=()=>bd(r.error);
      });
    }

    async function sdl(){
      try{
        const dbs=await indexedDB.databases();
        let sv={},fd=false;

        for(const inf of dbs){
          const db=await odb(inf.name);

          for(const st of db.objectStoreNames){
            try{
              const dt=await ga(db,st);

              if(dt&&dt.length>0){
                const fx=dt.map(it=>{
                  if(it.contents&&it.contents instanceof Uint8Array){
                    return {...it,contents:Array.from(it.contents)};
                  }
                  return it;
                });

                sv[`${inf.name}/${st}`]=fx;
                fd=true;
              }
            }catch(e){}
          }

          db.close();
        }

        if(!fd){
          alert('No save found');
          return;
        }

        const js=JSON.stringify(sv),
          bl=new Blob([js],{type:'application/octet-stream'}),
          u=URL.createObjectURL(bl),
          a=document.createElement('a');

        a.href=u;
        a.download='hk_save.dat';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(u);
      }catch(e){
        alert('Download failed: '+e.message);
      }
    }
  </script>
</body>
</html>
