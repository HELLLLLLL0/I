<!DOCTYPE html>
<html lang="en-us">
  <head>
    <!-- REQUIRED for Unity -->

    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Hollow Knight SilkSong</title>

    <link rel="shortcut icon" href="/games/hollow-knight-silksong-master/silksong-icon.ico">
    <link rel="icon" type="image/x-icon" href="/games/hollow-knight-silksong-master/silksong-icon.ico">

    <link rel="stylesheet" href="TemplateData/style.css">
  </head>

  <body>
    <div id="loading-text" style="color: white; font-size: 20px; font-family: cursive; text-align: center; margin-top: 20px;">
      LOADING...
    </div>

    <div id="unity-container">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>
    </div>

    <button id="retry" hidden>Retry loading</button>
    <p style="position:fixed;bottom:8px;right:12px;color:#aaa;font:12px sans-serif">port by R Spedman</p>
    <script src="zip-assets.js"></script>
